name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html style.css js fonts icons manifest.webmanifest sw.js _site/
          # Stamp asset links with the commit so browsers fetch fresh copies after each deploy.
          sed -i -E 's#((href|src)="(style\.css|js/[a-z]+\.js|icons/[a-z0-9-]+\.png|manifest\.webmanifest))"#\1?v=${{ github.sha }}"#g' _site/index.html
          sed -i -E 's#("src": "icons/[a-z0-9-]+\.png)"#\1?v=${{ github.sha }}"#g' _site/manifest.webmanifest
          # A new service worker version per deploy, so installed copies update.
          sed -i "s/const VERSION = 'dev';/const VERSION = '${{ github.sha }}';/" _site/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
