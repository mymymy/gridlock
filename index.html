<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gridlock</title>
<meta name="description" content="Slide the cars and lorries until the red car can drive out.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Gridlock">
<meta name="theme-color" content="#e4e8ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14171b" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Gothic:wdth,wght@75..125,400..700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <header class="top">
    <h1 class="brand"><span class="sr-only">Gridlock</span><span class="brand-stack" aria-hidden="true"><span class="brand-word wave" style="--n: 8"><span style="--i: 0; --c: var(--tier1)">G</span><span style="--i: 1; --c: var(--tier2)">r</span><span style="--i: 2; --c: var(--tier3)">i</span><span style="--i: 3; --c: var(--tier4)">d</span><span style="--i: 4; --c: var(--tier5)">l</span><span style="--i: 5; --c: var(--tier6)">o</span><span style="--i: 6; --c: var(--tier1)">c</span><span style="--i: 7; --c: var(--tier2)">k</span></span></span></h1>
    <p class="card-label"><span id="card-name">Level 1</span> · <span id="tier" class="tier">Beginner</span></p>
  </header>

  <section class="play">
    <div class="board-wrap">
      <div class="board" id="board" tabindex="-1" role="group" aria-label="Parking grid, 6 by 6">
        <div class="grid" id="grid"></div>
        <div class="exit" aria-hidden="true"><span>EXIT</span></div>
      </div>
      <div class="win" id="win" hidden>
        <p class="win-title"><span class="sr-only" id="win-title-text">Well done</span><span class="wave" id="win-title" aria-hidden="true"></span></p>
        <p class="win-body" id="win-body"></p>
        <button type="button" id="win-next" class="btn btn-primary">Next level</button>
      </div>
    </div>

    <dl class="stats">
      <div><dt>Moves</dt><dd id="moves">0</dd></div>
      <div><dt>Best</dt><dd id="best">–</dd></div>
    </dl>

    <div class="controls">
      <button type="button" id="undo" class="btn">Undo</button>
      <button type="button" id="reset" class="btn">Reset</button>
      <button type="button" id="hint" class="btn">Hint</button>
    </div>
    <p class="help" id="help" aria-live="polite">Drag a vehicle along its lane. Get the red car to the exit.</p>
    <p class="sr-only" id="announce" aria-live="polite"></p>
  </section>

  <section class="cards" aria-labelledby="cards-title">
    <h2 id="cards-title">Levels</h2>
    <div class="card-groups" id="card-groups"></div>
  </section>
</main>
<script src="js/solver.js"></script>
<script src="js/levels.js"></script>
<script src="js/vehicles.js"></script>
<script src="js/game.js"></script>
<script>
  // Offline support once installed (over https, or locally for testing).
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
