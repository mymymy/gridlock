<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gridlock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Strichpunkt+Sans:wght@400..800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <header class="top">
    <h1 class="brand">Gridlock</h1>
    <p class="card-label"><span id="card-name">Level 1</span> · <span id="tier" class="tier">Beginner</span></p>
  </header>

  <section class="play">
    <div class="board-wrap">
      <div class="board" id="board" aria-label="Parking grid, 6 by 6">
        <div class="grid" id="grid"></div>
        <div class="exit" aria-hidden="true"><span>EXIT</span></div>
      </div>
      <div class="win" id="win" hidden>
        <p class="win-title">Well done!</p>
        <p class="win-body" id="win-body"></p>
        <button type="button" id="win-next" class="btn btn-primary">Next level</button>
      </div>
    </div>

    <dl class="stats">
      <div><dt>Moves</dt><dd id="moves">0</dd></div>
      <div><dt>Best</dt><dd id="best">–</dd></div>
    </dl>

    <div class="controls">
      <button type="button" id="undo" class="btn">Undo</button>
      <button type="button" id="reset" class="btn">Reset</button>
      <button type="button" id="hint" class="btn">Hint</button>
    </div>
    <p class="help" id="help">Drag a vehicle along its lane. Get the red car to the exit.</p>
  </section>

  <section class="cards" aria-labelledby="cards-title">
    <h2 id="cards-title">Levels</h2>
    <div class="card-groups" id="card-groups"></div>
  </section>
</main>
<script src="js/solver.js"></script>
<script src="js/levels.js"></script>
<script src="js/vehicles.js"></script>
<script src="js/game.js"></script>
</body>
</html>
